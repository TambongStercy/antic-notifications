server {
    listen 80;
    server_name notification.antic.cm;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name notification.antic.cm;

    ssl_certificate /app/onlyoffice/DocumentServer/data/certs/antic.crt;
    ssl_certificate_key /app/onlyoffice/DocumentServer/data/certs/antic.key;
    ssl_trusted_certificate /app/onlyoffice/DocumentServer/data/certs/intermediaire.crt;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100M;

    # Proxy everything to Docker nginx on host machine
    location / {
        proxy_pass http://10.0.2.2:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts for long requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://10.0.2.2:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
