server {
    listen 80;
    server_name notification.antic.cm;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name notification.antic.cm;

    ssl_certificate /app/onlyoffice/DocumentServer/data/certs/antic.crt;
    ssl_certificate_key /app/onlyoffice/DocumentServer/data/certs/antic.key;
    ssl_trusted_certificate /app/onlyoffice/DocumentServer/data/certs/intermediaire.crt;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100M;

    # Proxy to Windows Docker on host-only network (use HTTP to avoid double SSL)
    location / {
        proxy_pass http://192.168.56.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Handle redirects
        proxy_redirect http://192.168.56.1:8080/ https://notification.antic.cm/;
        proxy_redirect http://$host/ https://$host/;
    }
}
